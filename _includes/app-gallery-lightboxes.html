<!-- Lightbox for Memory by Seasons -->
{% if include.app == nil or include.app == "memory" %}
<div id="lightbox-memory" class="lightbox">
  <button class="lightbox-close" type="button" aria-label="Close screenshot" onclick="closeLightbox('memory')">&times;</button>
  <div class="lightbox-content">
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous screenshot" onclick="changeImage('memory', -1)">&#10094;</button>
    <img id="lightbox-img-memory" src="" alt="Screenshot">
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Next screenshot" onclick="changeImage('memory', 1)">&#10095;</button>
  </div>
  <div class="lightbox-counter">
    <span id="lightbox-counter-memory"></span>
  </div>
</div>

<!-- Lightbox for Closet Flow -->
{% endif %}
{% if include.app == nil or include.app == "closet" %}
<div id="lightbox-closet" class="lightbox">
  <button class="lightbox-close" type="button" aria-label="Close screenshot" onclick="closeLightbox('closet')">&times;</button>
  <div class="lightbox-content">
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous screenshot" onclick="changeImage('closet', -1)">&#10094;</button>
    <img id="lightbox-img-closet" src="" alt="Screenshot">
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Next screenshot" onclick="changeImage('closet', 1)">&#10095;</button>
  </div>
  <div class="lightbox-counter">
    <span id="lightbox-counter-closet"></span>
  </div>
</div>

<!-- Lightbox for Fun with Crosswords -->
{% endif %}
{% if include.app == nil or include.app == "crosswords" %}
<div id="lightbox-crosswords" class="lightbox">
  <button class="lightbox-close" type="button" aria-label="Close screenshot" onclick="closeLightbox('crosswords')">&times;</button>
  <div class="lightbox-content">
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous screenshot" onclick="changeImage('crosswords', -1)">&#10094;</button>
    <img id="lightbox-img-crosswords" src="" alt="Screenshot">
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Next screenshot" onclick="changeImage('crosswords', 1)">&#10095;</button>
  </div>
  <div class="lightbox-counter">
    <span id="lightbox-counter-crosswords"></span>
  </div>
</div>

{% endif %}
<script>
  const carouselIds = {
    memory: 'carouselMemory',
    closet: 'carouselCloset',
    crosswords: 'carouselCrosswords'
  };

  // Lightbox image arrays
  const images = {
    memory: [
      'img/portfolio/memory-by-seasons/Simulator Screenshot - iPhone 17 Pro Max - 2026-01-11 at 10.40.49.png',
      'img/portfolio/memory-by-seasons/Simulator Screenshot - iPhone 17 Pro Max - 2026-01-11 at 10.40.58.png',
      'img/portfolio/memory-by-seasons/Simulator Screenshot - iPhone 17 Pro Max - 2026-01-11 at 10.41.07.png',
      'img/portfolio/memory-by-seasons/Simulator Screenshot - iPhone 17 Pro Max - 2026-01-11 at 10.41.19.png',
      'img/portfolio/memory-by-seasons/Simulator Screenshot - iPhone 17 Pro Max - 2026-01-11 at 10.43.52.png',
      'img/portfolio/memory-by-seasons/Simulator Screenshot - iPhone 17 Pro Max - 2026-01-11 at 10.45.33.png',
      'img/portfolio/memory-by-seasons/Simulator Screenshot - iPhone 17 Pro Max - 2026-01-11 at 10.45.48.png',
      'img/portfolio/memory-by-seasons/Simulator Screenshot - iPhone 17 Pro Max - 2026-01-11 at 10.51.53.png',
      'img/portfolio/memory-by-seasons/Simulator Screenshot - iPhone 17 Pro Max - 2026-01-11 at 11.08.41.png',
      'img/portfolio/memory-by-seasons/Simulator Screenshot - iPhone 17 Pro Max - 2026-01-11 at 11.08.57.png',
      'img/portfolio/memory-by-seasons/Simulator Screenshot - iPhone 17 Pro Max - 2026-01-11 at 11.14.50.png',
      'img/portfolio/memory-by-seasons/Simulator Screenshot - iPhone 17 Pro Max - 2026-01-11 at 11.14.53.png',
      'img/portfolio/memory-by-seasons/Simulator Screenshot - iPhone 17 Pro Max - 2026-01-11 at 11.15.00.png',
      'img/portfolio/memory-by-seasons/Simulator Screenshot - iPhone 17 Pro Max - 2026-01-11 at 11.17.34.png'
    ],
    closet: Array.from(document.querySelectorAll('#carouselCloset .carousel-inner img'), image => image.getAttribute('src')),
    crosswords: [
      'img/portfolio/fun-with-crosswords/Simulator Screenshot - iPhone Air - 2025-11-16 at 23.38.30.png',
      'img/portfolio/fun-with-crosswords/Simulator Screenshot - iPhone Air - 2025-11-16 at 23.38.35.png',
      'img/portfolio/fun-with-crosswords/Simulator Screenshot - iPhone Air - 2025-11-16 at 23.38.41.png',
      'img/portfolio/fun-with-crosswords/Simulator Screenshot - iPhone Air - 2025-11-16 at 23.38.47.png',
      'img/portfolio/fun-with-crosswords/Simulator Screenshot - iPhone Air - 2025-11-16 at 23.38.52.png',
      'img/portfolio/fun-with-crosswords/Simulator Screenshot - iPhone Air - 2025-11-16 at 23.39.03.png',
      'img/portfolio/fun-with-crosswords/Simulator Screenshot - iPhone Air - 2025-11-16 at 23.39.10.png',
      'img/portfolio/fun-with-crosswords/Simulator Screenshot - iPhone Air - 2025-11-16 at 23.39.15.png',
      'img/portfolio/fun-with-crosswords/Simulator Screenshot - iPhone Air - 2025-11-16 at 23.39.20.png'
    ]
  };

  let currentIndex = {
    memory: 0,
    closet: 0,
    crosswords: 0
  };

  Object.entries(carouselIds).forEach(([app, carouselId]) => {
    document.querySelectorAll(`#${carouselId} .carousel-inner img`).forEach((image, index) => {
      image.tabIndex = 0;
      image.setAttribute('role', 'button');
      image.setAttribute('aria-label', `${image.alt} - view full size`);
      image.addEventListener('click', () => openLightbox(app, index));
      image.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openLightbox(app, index);
        }
      });
    });
  });

  function openLightbox(app, index) {
    currentIndex[app] = index;
    const lightbox = document.getElementById('lightbox-' + app);
    const img = document.getElementById('lightbox-img-' + app);
    const counter = document.getElementById('lightbox-counter-' + app);

    img.src = images[app][index];
    img.alt = document.querySelectorAll(`#${carouselIds[app]} .carousel-inner img`)[index].alt;
    counter.textContent = (index + 1) + ' / ' + images[app].length;
    lightbox.style.display = 'block';
    document.body.style.overflow = 'hidden';
    document.dispatchEvent(new CustomEvent('gallery-lightbox', { detail: true }));
  }

  function closeLightbox(app) {
    const lightbox = document.getElementById('lightbox-' + app);
    lightbox.style.display = 'none';
    document.body.style.overflow = 'auto';
    document.dispatchEvent(new CustomEvent('gallery-lightbox', { detail: false }));
  }

  function changeImage(app, direction) {
    currentIndex[app] += direction;

    if (currentIndex[app] >= images[app].length) {
      currentIndex[app] = 0;
    } else if (currentIndex[app] < 0) {
      currentIndex[app] = images[app].length - 1;
    }

    const img = document.getElementById('lightbox-img-' + app);
    const counter = document.getElementById('lightbox-counter-' + app);

    img.src = images[app][currentIndex[app]];
    img.alt = document.querySelectorAll(`#${carouselIds[app]} .carousel-inner img`)[currentIndex[app]].alt;
    counter.textContent = (currentIndex[app] + 1) + ' / ' + images[app].length;
  }

  // Keyboard navigation
  document.addEventListener('keydown', function(e) {
    const memoryLightbox = document.getElementById('lightbox-memory');
    const closetLightbox = document.getElementById('lightbox-closet');
    const crosswordsLightbox = document.getElementById('lightbox-crosswords');

    let activeApp = null;
    if (memoryLightbox?.style.display === 'block') activeApp = 'memory';
    else if (closetLightbox?.style.display === 'block') activeApp = 'closet';
    else if (crosswordsLightbox?.style.display === 'block') activeApp = 'crosswords';

    if (activeApp) {
      if (e.key === 'ArrowLeft') {
        changeImage(activeApp, -1);
      } else if (e.key === 'ArrowRight') {
        changeImage(activeApp, 1);
      } else if (e.key === 'Escape') {
        closeLightbox(activeApp);
      }
    }
  });

  // Close lightbox when clicking outside the image
  document.querySelectorAll('.lightbox').forEach(lightbox => {
    lightbox.addEventListener('click', function(e) {
      if (e.target === this) {
        const app = this.id.replace('lightbox-', '');
        closeLightbox(app);
      }
    });
  });
</script>
